<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Welcome — DailyDeenHub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c1f1a">
<style>
  :root {
    --emerald: #0c1f1a;
    --gold: #d4a574;
    --teal: #14b8a6;
    --ink: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--emerald) url("/images/floral-bg.webp") center/cover no-repeat fixed;
    color: #fff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .banner {
    width: 100%;
    height: 32dvh;
    min-height: 220px;
    background: url("/images/welcome-banner.webp") center/cover no-repeat;
    border-radius: 0 0 48px 48px;
    flex-shrink: 0;
  }
  .card {
    background: #fff;
    color: var(--ink);
    border-radius: 32px;
    margin: -56px 24px 0;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    position: relative;
    z-index: 1;
  }
  .greeting {
    color: #f59e0b;
    font-size: 1.65rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .appname {
    font-size: 1.9rem;
    font-weight: 300;
    color: #333;
    margin-bottom: 6px;
  }
  .tagline {
    color: #666;
    font-size: 1.05rem;
    margin-bottom: 24px;
  }
  .langbtn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: #f1f1f1;
    border: none;
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 1.05rem;
    color: #333;
    cursor: pointer;
  }
  .langbtn .chev { color: #999; font-size: 1.3rem; }
  .bottom {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px 32px calc(32px + env(safe-area-inset-bottom));
    gap: 20px;
  }
  .terms {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: .92rem;
    line-height: 1.45;
    color: #e8e8e8;
  }
  .terms input {
    width: 22px; height: 22px;
    margin-top: 2px;
    accent-color: var(--teal);
    flex-shrink: 0;
    cursor: pointer;
  }
  .terms a { color: var(--teal); }
  .ctabtn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    width: 100%;
  }
  .ctabtn:disabled { opacity: .45; cursor: not-allowed; }
  .langmenu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }
  .langmenu.open { display: flex; }
  .langmenu .sheet {
    background: #fff;
    color: var(--ink);
    width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 12px 0 calc(20px + env(safe-area-inset-bottom));
    max-height: 70dvh;
    overflow-y: auto;
  }
  .langmenu button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    padding: 16px 24px;
    font-size: 1.1rem;
    text-align: left;
    color: var(--ink);
    cursor: pointer;
  }
  .langmenu button:active { background: #f0f0f0; }
</style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SDEZLDPY9Y"></script>
<script src="/ga.js?v=1"></script>
</head>
<body>
  <div class="banner"></div>

  <div class="card">
    <div class="greeting" id="wGreet">Assalamu Alaikum</div>
    <div class="appname">Daily Deen Hub</div>
    <div class="tagline" id="wTag">Your companion for everyday life</div>
    <button class="langbtn" id="wLangBtn" type="button">
      <span id="wLangLabel">English</span><span class="chev">›</span>
    </button>
  </div>

  <div class="bottom">
    <label class="terms">
      <input type="checkbox" id="wTerms">
      <span id="wTermsText">I agree to the <a href="/privacy.html">Terms of Use</a> and the <a href="/privacy.html">Privacy Policy</a> of the Application.</span>
    </label>
    <button class="ctabtn" id="wCta" type="button" disabled>FIND MY LOCATION</button>
  </div>

  <div class="langmenu" id="wLangMenu">
    <div class="sheet">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="tr">Türkçe</button>
      <button type="button" disabled style="opacity:.4">العربية <small style="color:#999">— soon</small></button>
      <button type="button" disabled style="opacity:.4">Français <small style="color:#999">— soon</small></button>
      <button type="button" disabled style="opacity:.4">اردو <small style="color:#999">— soon</small></button>
      <button type="button" disabled style="opacity:.4">Bahasa Indonesia <small style="color:#999">— soon</small></button>
    </div>
  </div>

  <div class="langmenu" id="wLocConsent">
    <div class="sheet" style="border-radius:24px;margin:0 24px 40px;padding:28px 24px;">
      <div style="font-size:1.25rem;font-weight:700;margin-bottom:14px;color:#1a1a1a;" id="wLcTitle">For your information</div>
      <div style="font-size:.98rem;line-height:1.55;color:#444;margin-bottom:24px;" id="wLcBody">Daily Deen Hub uses your location to calculate accurate prayer times, find the Qibla direction, and locate nearby mosques.</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" id="wLcNo" style="color:#14b8a6;font-weight:700;font-size:.95rem;padding:12px 16px;">NOT NOW</button>
        <button type="button" id="wLcYes" style="color:#14b8a6;font-weight:700;font-size:.95rem;padding:12px 16px;">AGREE</button>
      </div>
    </div>
  </div>

<script src="/welcome.js?v=2"></script>
</body>
</html>
