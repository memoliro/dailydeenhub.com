<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qibla map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Outfit", "Avenir Next", system-ui, sans-serif; background: #0a0f1e; color: #f6f1e8; }
    .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    body.embed .bar { display: none; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(212,165,116,.25); }
    .bar b { font-family: Georgia, serif; font-weight: 560; }
    input, button { font: inherit; color: inherit; }
    input { flex: 1; min-width: 0; border: 1px solid rgba(212,165,116,.28); background: transparent; border-radius: 999px; padding: 8px 12px; }
    button { border: 1px solid rgba(212,165,116,.28); background: #172033; color: #f6f1e8; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
    #map { width: 100%; height: 100%; min-height: 320px; background: #12182b; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 12px 12px; }
    .stats div { border: 1px solid rgba(212,165,116,.2); border-radius: 14px; padding: 8px 10px; }
    .stats span { display: block; color: #a7b0c2; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .stats strong { font-variant-numeric: tabular-nums; font-size: 18px; }
    .maplibregl-ctrl-attrib { font-size: 11px; }
    @media (max-width: 720px) { .stats { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <b>Qibla</b>
      <input id="q" placeholder="Search a city" />
      <button id="locate" type="button">My location</button>
    </div>
    <div id="map"></div>
    <div class="stats">
      <div><span>True qibla</span><strong id="bearing">—</strong></div>
      <div><span>Distance</span><strong id="distance">—</strong></div>
      <div><span>Map center</span><strong id="coords">—</strong></div>
      <div><span>Line</span><strong id="status">Drag the map</strong></div>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script>
    const KAABA = { lat: 21.4225, lon: 39.8262 };
    const params = new URLSearchParams(location.search);
    if (params.get("embed") === "1") document.body.classList.add("embed");
    const start = {
      lat: Number(params.get("lat")) || 45.5017,
      lon: Number(params.get("lon")) || -73.5673,
      name: params.get("name") || "Montreal"
    };

    function bearing(lat, lon) {
      const φ1 = lat * Math.PI / 180, λ1 = lon * Math.PI / 180;
      const φ2 = KAABA.lat * Math.PI / 180, λ2 = KAABA.lon * Math.PI / 180;
      const y = Math.sin(λ2 - λ1);
      const x = Math.cos(φ1) * Math.tan(φ2) - Math.sin(φ1) * Math.cos(λ2 - λ1);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    function distanceKm(lat, lon) {
      const R = 6371;
      const φ1 = lat * Math.PI / 180, φ2 = KAABA.lat * Math.PI / 180;
      const dφ = (KAABA.lat - lat) * Math.PI / 180;
      const dλ = (KAABA.lon - lon) * Math.PI / 180;
      const a = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }
    function destination(lat, lon, deg, km) {
      const R = 6371, δ = km / R, θ = deg * Math.PI / 180;
      const φ1 = lat * Math.PI / 180, λ1 = lon * Math.PI / 180;
      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
      return [((λ2 * 180 / Math.PI + 540) % 360) - 180, φ2 * 180 / Math.PI];
    }
    function spanKm() {
      const b = map.getBounds();
      return b.getSouthWest().distanceTo(b.getNorthEast()) / 1000;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [start.lon, start.lat],
      zoom: 13
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    function lineData() {
      const c = map.getCenter();
      const b = bearing(c.lat, c.lng);
      const km = distanceKm(c.lat, c.lng);
      const end = destination(c.lat, c.lng, b, Math.max(0.4, spanKm() * 0.42));
      return {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { kind: "line" }, geometry: { type: "LineString", coordinates: [[c.lng, c.lat], end] } },
          { type: "Feature", properties: { kind: "you" }, geometry: { type: "Point", coordinates: [c.lng, c.lat] } },
          { type: "Feature", properties: { kind: "kaaba" }, geometry: { type: "Point", coordinates: [KAABA.lon, KAABA.lat] } }
        ],
        bearing: b,
        km
      };
    }
    function redraw() {
      const data = lineData();
      const source = map.getSource("qibla");
      if (source) source.setData(data);
      const c = map.getCenter();
      document.getElementById("bearing").textContent = data.km < 1 ? "Kaaba" : data.bearing.toFixed(2) + "°";
      document.getElementById("distance").textContent = data.km.toFixed(0) + " km";
      document.getElementById("coords").textContent = c.lat.toFixed(4) + ", " + c.lng.toFixed(4);
      document.getElementById("status").textContent = "Live";
    }

    map.on("load", () => {
      map.addSource("qibla", { type: "geojson", data: lineData() });
      map.addLayer({ id: "qibla-line", type: "line", source: "qibla", filter: ["==", ["get", "kind"], "line"], paint: { "line-color": "#8d5e32", "line-width": 4 } });
      map.addLayer({ id: "qibla-you", type: "circle", source: "qibla", filter: ["==", ["get", "kind"], "you"], paint: { "circle-radius": 7, "circle-color": "#d4a574", "circle-stroke-width": 2, "circle-stroke-color": "#8d5e32" } });
      map.addLayer({ id: "qibla-kaaba", type: "circle", source: "qibla", filter: ["==", ["get", "kind"], "kaaba"], paint: { "circle-radius": 5, "circle-color": "#1a1a1a", "circle-stroke-width": 2, "circle-stroke-color": "#8d5e32" } });
      redraw();
    });
    map.on("move", redraw);

    document.getElementById("locate").onclick = () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        map.jumpTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14 });
      });
    };
    let timer = 0;
    document.getElementById("q").addEventListener("input", e => {
      clearTimeout(timer);
      const q = e.target.value.trim();
      if (q.length < 2) return;
      timer = setTimeout(async () => {
        const res = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(q));
        const hit = ((await res.json()).results || [])[0];
        if (hit) map.jumpTo({ center: [hit.longitude, hit.latitude], zoom: 12 });
      }, 280);
    });
    document.getElementById("q").value = start.name;
  </script>
</body>
</html>
